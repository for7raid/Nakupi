version: '3.8'

services:
  app:
    build: .
    container_name: nakupi-bot
    restart: always
    volumes:
      - ./logs:/app/logs
      - ./metrics:/app/metrics
    environment:
      - NODE_ENV=production
      - TELEGRAM_BOT_TOKEN=7334988952:AAHLn2fTiNWE23yNBnkK7aM2cZr-XSqgwrI
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB_NAME=nakupi_prod
      - METRICS_FILE_PATH=metrics/bot_metrics.json
      - METRICS_STORAGE=mongo 
    depends_on:
      - mongodb

  mongodb:
    image: mongo:latest
    container_name: nakupi-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGODB_DB_NAME=nakupi_prod

volumes:
  mongo_data: 